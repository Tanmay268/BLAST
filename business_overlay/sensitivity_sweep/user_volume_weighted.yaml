version: 2
system: online-boutique
value_model: user_volume_weighted
note: 'Weighted by REAL observed baseline request volume per capability (summed n_baseline
  across journey types realising it, journey_impairment_full.csv), scaled to the same
  0-100 range as the revenue-weighted model. Not declared -- measured. Note the structural
  limitation this exposes: payment_processing and order_confirmation were never observed
  as independent journey roots (see online_boutique_v2.yaml), so a pure volume model
  floors them near zero despite plausibly being business-critical.'
capabilities:
- id: order_placement
  display: Order Placement
  value_per_min: 3.7951
  realised_by:
  - PlaceOrder
- id: payment_processing
